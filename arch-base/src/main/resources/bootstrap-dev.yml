spring:
  config:
    import: "nacos:arch-base.yaml?group=DEFAULT_GROUP&namespace=f52b16a2-2434-4a52-b096-b7c52dbc974d"
  application:
    name: arch-base
  cloud:
    nacos:
      # 通用配置（配置中心和注册中心可共享）
      server-addr: 10.0.0.2:18848  # Nacos服务器地址
      username: nacos  # Nacos登录账号
      password: nacos  # Nacos登录密码
      # 配置中心专项配置
      config:
        file-extension: yaml
        namespace: f52b16a2-2434-4a52-b096-b7c52dbc974d

      # 注册中心专项配置
      discovery:
        ephemeral: true
        namespace: f52b16a2-2434-4a52-b096-b7c52dbc974d